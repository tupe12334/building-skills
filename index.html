          <text x="400" y="434" text-anchor="middle" class="t-caption">inject context only when relevant · move enforcement to where it belongs</text>
        </g>
      </svg>
    </div>

    <!-- ─── SLIDE 8: TAKEAWAYS ─── -->
    <div class="slide" id="s7">
      <svg class="slide-svg" viewBox="0 0 800 500">
        <text x="400" y="46" text-anchor="middle" class="t-label">take away</text>
        <line x1="200" y1="62" x2="600" y2="62" class="rule-line" />
        <g class="reveal-group" style="--d:0.1s">
          <circle cx="72" cy="124" r="16" class="num-circle" />
          <text x="72" y="129" text-anchor="middle" class="t-tag">1</text>
          <text x="106" y="118" class="t-label" style="font-size:16px">fetch with algorithms</text>
          <text x="106" y="138" class="t-caption">git · grep · read — deterministic, zero reasoning cost</text>
        </g>
        <g class="reveal-group" style="--d:0.3s">
          <circle cx="72" cy="204" r="16" class="num-circle" />
          <text x="72" y="209" text-anchor="middle" class="t-tag">2</text>
          <text x="106" y="198" class="t-label" style="font-size:16px">reason with LLM</text>
          <text x="106" y="218" class="t-caption">classify · summarize · decide — where compute is justified</text>
        </g>
        <g class="reveal-group" style="--d:0.5s">
          <circle cx="72" cy="284" r="16" class="num-circle" />
          <text x="72" y="289" text-anchor="middle" class="t-tag">3</text>
          <text x="106" y="278" class="t-label" style="font-size:16px">compose into a skill</text>
          <text x="106" y="298" class="t-caption">name + description trigger + step sequence → SKILL.md</text>
        </g>
        <g class="reveal-group" style="--d:0.7s">
          <circle cx="72" cy="364" r="16" class="num-circle" />
          <text x="72" y="369" text-anchor="middle" class="t-tag">4</text>
          <text x="106" y="358" class="t-label" style="font-size:16px">distil what you already do</text>
          <text x="106" y="378" class="t-caption">do once manually → observe → codify → share with team</text>
        </g>
        <g class="reveal-group" style="--d:0.9s">
          <line x1="200" y1="432" x2="600" y2="432" class="rule-line" />
          <text x="400" y="460" text-anchor="middle" class="t-eyebrow">any repeated task can become a skill</text>
        </g>
      </svg>
    </div>

  </div><!-- /.deck -->

  <!-- Guide panel -->
  <div class="guide-panel" id="guide-panel">
    <button class="guide-handle" id="guide-handle" aria-expanded="false">
      <span class="guide-handle-label">tutorial guide</span>
      <span class="guide-handle-icon" id="guide-icon" aria-hidden="true">▲</span>
    </button>
    <div class="guide-content" id="guide-content">
      <p class="guide-text" id="guide-text"></p>
    </div>
  </div>

  <!-- Nav -->
  <nav class="slide-nav">
    <button class="nav-btn" id="prev" aria-label="Previous step">←</button>
    <div class="progress-dots" id="dots"></div>
    <button class="nav-btn" id="next" aria-label="Next step">→</button>
    <div class="nav-separator" aria-hidden="true"></div>
    <button class="nav-btn tts-btn" id="speak-btn" title="Read aloud (Kokoro TTS)" aria-label="Read slide aloud">▶</button>
  </nav>

  <script type="module">
    // ── Tutorial text ──────────────────────────────────────────────────────
    const TTS_TEXTS = [
      "Welcome to Building Skills — an interactive guide to Claude Code skills. In this tutorial you will learn when to use algorithms versus language models, how to structure a skill file, and how to distil repetitive tasks into shareable, automatically triggered behaviors. Press the right arrow or swipe to begin.",
      "Why build skills? Without them, Claude improvises every time you give it a task. Quality varies between runs, steps get missed, and style drifts. A skill captures the exact procedure in a SKILL dot M D file. The result is repeatable behavior that triggers automatically and can be shared with your entire team.",
      "Think of your tools on a spectrum from deterministic to probabilistic. On the left: algorithms — same input always produces the same output. On the right: the language model — adapts freely but unpredictably. In the middle: skills. Skills define a sequence of steps using both sides, deterministic where possible, probabilistic only where necessary.",
      "Route each decision to the right tool. When you need to fetch a fact — does a file exist, what is the raw diff, how many lines are there — use an algorithm: git, grep, or a file read. These are deterministic and cost nothing to reason about. When you need to understand something — is this file relevant, what does the diff mean, how do I classify this error — hand it to the language model.",
      "A SKILL dot M D file has two sections. The frontmatter at the top contains a name and a description. Claude reads the description to decide when to auto-invoke this skill, so write it as a clear trigger condition. The body contains the workflow steps: first gather data with algorithms, then reason with the language model, then act on the result.",
      "The easiest way to build a skill is to distil something you already do manually. Find a task you repeat. Perform it once and observe yourself. Ask three questions: What data did I fetch? What decision did I make? What triggered me to start? The answers map directly to your skill's data gathering steps, reasoning step, and trigger description.",
      "Here is a concrete example: the find-deploy-env skill. Step one: run gcloud to list Cloud Run services — pure algorithm. Step two: format the output with a value filter — still deterministic. Step three: sort services and find the oldest — more algorithmic logic. Step four: have the language model format the output as a readable table and highlight the selected environment. Three algorithm steps, one language model step.",
      "A common mistake is putting enforcement rules like lint configurations into your main context file. Those rules load on every conversation — even when you are just asking what a function does. They consume context without helping. Move enforcement to where it belongs: a pre-push hook. Your context window carries only what is relevant to the current question, and your rules still run exactly when they should.",
      "Four things to remember. One: fetch with algorithms — git, grep, file reads — free, deterministic, no reasoning cost. Two: reason with the language model — classification, summarization, decisions — use compute only where judgment is needed. Three: compose into a skill — name, trigger description, step sequence — write it as a SKILL dot M D file. Four: distil what you already do manually — perform it once, observe the steps, codify them, share with your team. Any repeated task can become a skill.",
    ];

    const SLIDE_NAMES = [
      'intro', 'why skills', 'the spectrum', 'fetch vs understand',
      'skill anatomy', 'distillation', 'live example', 'context', 'takeaways',
    ];

    // ── State ──────────────────────────────────────────────────────────────
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    let ttsState = 'idle'; // idle | ready | playing | error

    // ── Nav helpers ────────────────────────────────────────────────────────
    function buildDots() {
      const container = document.getElementById('dots');
      slides.forEach(() => {
        const d = document.createElement('span');
        d.className = 'dot';
        container.appendChild(d);
      });
    }

    function updateDots() {
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('dot-active', i === current);
      });
    }

    function updateStepIndicator() {
      const name = SLIDE_NAMES[current] || '';
      document.getElementById('step-label').textContent =
        `${current + 1} / ${slides.length}  ·  ${name}`;
    }

    function updateGuideText() {
      document.getElementById('guide-text').textContent = TTS_TEXTS[current] || '';
    }

    function go(n) {
      if (ttsState === 'playing') { synth.cancel(); setTTSState('ready'); }

      slides[current].classList.remove('active');
      current = Math.max(0, Math.min(n, slides.length - 1));

      slides[current].querySelectorAll('.reveal-group').forEach(g => {
        g.style.animation = 'none';
        void g.offsetWidth;
        g.style.animation = '';
      });

      slides[current].classList.add('active');
      updateDots();
      updateStepIndicator();
      updateGuideText();

      document.getElementById('prev').disabled = current === 0;
      document.getElementById('next').disabled = current === slides.length - 1;
    }

    // ── Guide panel ────────────────────────────────────────────────────────
    const guidePanel = document.getElementById('guide-panel');
    document.getElementById('guide-handle').addEventListener('click', () => {
      const open = guidePanel.classList.toggle('guide-open');
      document.getElementById('guide-handle').setAttribute('aria-expanded', String(open));
      document.getElementById('guide-icon').textContent = open ? '▼' : '▲';
    });

    // ── TTS (Web Speech API + Kokoro fallback) ─────────────────────────────
    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
    }
    loadVoices();
    synth.addEventListener('voiceschanged', loadVoices);

    function preferredVoice() {
      const en = voices.filter(v => v.lang.startsWith('en'));
      return (
        en.find(v => /Samantha|Karen|Moira|Fiona/.test(v.name)) ||
        en.find(v => /Google/.test(v.name)) ||
        en[0] ||
        null
      );
    }

    function setTTSState(state) {
      ttsState = state;
      const btn = document.getElementById('speak-btn');
      btn.className = 'nav-btn tts-btn';
      btn.disabled = false;
      switch (state) {
        case 'playing':
          btn.textContent = '■';
          btn.classList.add('tts-playing');
          btn.title = 'Stop';
          break;
        case 'error':
          btn.textContent = '✕';
          btn.title = 'TTS unavailable';
          break;
        default:
          btn.textContent = '▶';
          btn.title = 'Read aloud';
      }
    }

    function handleSpeak() {
      if (ttsState === 'playing') {
        synth.cancel();
        setTTSState('ready');
        return;
      }
      if (ttsState === 'error') return;

      const text = TTS_TEXTS[current];
      if (!text || !synth) return;

      synth.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      const v = preferredVoice();
      if (v) utt.voice = v;
      utt.rate = 0.88;
      utt.pitch = 1.0;

      utt.onstart  = () => setTTSState('playing');
      utt.onend    = () => setTTSState('ready');
      utt.onerror  = (e) => { if (e.error !== 'interrupted') setTTSState('error'); else setTTSState('ready'); };

      setTTSState('playing');
      synth.speak(utt);
    }

    // ── Events ─────────────────────────────────────────────────────────────
    document.getElementById('speak-btn').addEventListener('click', () => handleSpeak());
    document.getElementById('prev').addEventListener('click', () => go(current - 1));
    document.getElementById('next').addEventListener('click', () => go(current + 1));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(current + 1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   go(current - 1);
    });

    let touchX = 0;
    document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) go(current + (dx < 0 ? 1 : -1));
    }, { passive: true });

    // ── Init ───────────────────────────────────────────────────────────────
    buildDots();
    go(0);
  </script>
</body>
